map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=bbport_signup:10m rate=2r/s;

server {
    listen 80;
    server_name 82.157.168.20;
    location = /generate_204 { return 204; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / { return 301 https://82.157.168.20$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 82.157.168.20;
    ssl_certificate /etc/letsencrypt/live/82.157.168.20/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.157.168.20/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;

    location = /v1/status {
        proxy_set_header Host $host;
        proxy_pass http://shadnet:18080;
    }
    location ~ ^/v1/(apply|application|register|device-key|presence)$ {
        limit_req zone=bbport_signup burst=10 nodelay;
        proxy_set_header Host $host;
        proxy_pass http://shadnet:18080;
    }
    location /v1/ { return 404; }
    location /api/v1/ { return 404; }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header True-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://headscale:8080;
    }
}
